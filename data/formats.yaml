# ─────────────────────────────────────────────────────────────────────────────
#  Diskettenformat-Katalog des K1520-Kerns
#
#  Vollständige Schema-Beschreibung: doc/K1520_architecture.md §8.6
#  Geladen von FormatCatalog (core/peripherals/floppy_drive/format_catalog.cpp).
#
#  Format-Ebene
#    name         (Pflicht)  eindeutiger Katalogname — C-API, GUI, Tools
#    description  (optional) Klartext für die GUI
#    drives       (Pflicht)  kompatible Laufwerksprofile; NUR diese bieten das Format an
#                            gültig: K5601, K5600.10, K5600.20, MF3200, MF6400
#    default_for  (optional) Profile, für die dies das Standardformat beim Anlegen ist
#    encoding     (optional) fm | mfm — Vorgabe für Spuren ohne eigenes encoding
#    containers   (optional) img | hfe — darstellbare Dateitypen (Default: beide)
#    step         (optional) 1 (Vorgabe) | 2 — Doppelschritt, siehe Kasten
#    rate         (optional) 250 (Vorgabe) | 500 — Grundrate in kbit/s (PC-Hochdichte); das
#                            Spurbereich-`rate: 125` unten ist ein Teiler DAVON
#    rpm          (optional) 300 | 360 — Drehzahl; Vorgabe aus den Laufwerken (360 nur 8")
#    tracks       (Pflicht)  Liste disjunkter Spurbereiche
#    title        (optional) Klartextname fuer Auswahllisten ("SCP 1715 Systemdiskette"); fehlend = leer
#    capacity     (optional) Marktbezeichnung als Anzeigetext ("800K", "1,44M"); NICHT die Bytezahl,
#                            frei formuliert und ungeprueft; fehlend = leer
#    aliases      (optional) frueher gueltige Namen [alt1, alt2]; FormatCatalog::find loest sie
#                            auf dieses Format auf (name() liefert den echten Namen).  Ein Alias
#                            darf weder ein Katalogname noch doppelt noch der eigene Name sein
#                            (sonst Hinweis + Alias verworfen).  Gleiches Feld gibt es bei den
#                            `filesystems:`-Profilen.  Aliase sind dauerhaft.
#    machines     (nur bei `filesystems:`-Profilen, optional) Liste der Rechner, fuer die die
#                            Diskette gedacht ist.  LEER/fehlend heisst UNBEKANNT, nicht "alle".
#                            Wortschatz (geschlossen; Waechter KatalogAnzeige.*):
#                              A5120, A5130, K8924, "A5120.16", K8915, "K8915 V2", "PRG 710",
#                              "PRG 710-1", "PC 1715", "PC 1715W", P8000, A7100, A7150, "PC 1834", MC80
#                            Nur eintragen, was belegt ist (Katalogbeschreibung, Merkposten); sonst [].
#
#  ┌───────────────────────────────────────────────────────────────────────────┐
#  │ `step: 2` — DOPPELSCHRITT (Austausch zwischen 96 tpi und 48 tpi)          │
#  │ Ein 96-tpi-Laufwerk (K5601, K5600.20) schreibt fuer den Austausch mit dem  │
#  │ 48-tpi-K5600.10 nur jede ZWEITE Spur — die Diskette ist dann im kleinen    │
#  │ Laufwerk lesbar (doc/format.md, „Wozu einseitig und Doppelschritt gut      │
#  │ sind"; die §3.4-Geometrien T und U).                                       │
#  │                                                                            │
#  │ `tracks:` bleibt dabei LOGISCH (`cyls: 0-39`) — genau so sieht das         │
#  │ Gastsystem die Diskette, und genau diese Nummer steht auch im ID-Feld.     │
#  │ `step` sagt nur, auf welchem PHYSISCHEN Zylinder eine logische Spur liegt: │
#  │ Spur n auf Zylinder n·step; die ungeraden Zylinder bleiben unformatiert.   │
#  │ Die Erkennung verlangt diese Luecken POSITIV, damit eine gewoehnliche      │
#  │ 40-Spur-Diskette nicht damit verwechselt wird.                             │
#  └───────────────────────────────────────────────────────────────────────────┘
#
#  Spurbereich
#    cyls / heads   Bereich, INKLUSIVE ("0", "2-79", "0-1")
#    sectors        Sektoren je Spur
#    size           Bytes/Sektor (128 | 256 | 512 | 1024)
#    encoding       (optional) fm | mfm — überschreibt die Format-Vorgabe (Mischdichte)
#    first_sector   (optional) erste Sektor-ID (Default 1)
#
#  ┌───────────────────────────────────────────────────────────────────────────┐
#  │ ACHTUNG — Verfahren nicht „aufhübschen".                                  │
#  │ Die A5120-Bootdisketten sind reines Standard-IBM-MFM: der Boot-ROM        │
#  │ startet in FM, findet keine Adressmarke und schaltet per MK auf MFM um    │
#  │ (doc/K1520_architecture.md §14.5).  Würde man die 128-B-Systemspuren von  │
#  │ cpa780/scpx780 als `encoding: fm` deklarieren — was intuitiv plausibel    │
#  │ wirkt —, bräche der verifizierte Bootpfad.  Alle 5,25″-Formate sind       │
#  │ deshalb durchgängig MFM; FM benutzt nur das echte 8″-SD-Format mf3200.    │
#  └───────────────────────────────────────────────────────────────────────────┘
# ─────────────────────────────────────────────────────────────────────────────
version: 1

formats:

  # ══ CP/A-Standardformate (5,25″, K5601) ════════════════════════════════════

  - name:        ds80_3t26x128-5x1024
    aliases:     [cpa780]
    description: "CP/A 780K Bootdiskette — 128B-Systembereich, 1024B-Daten"
    title:       "80 Spuren doppelseitig, Systembereich 26×128 + 5×1024"
    capacity:    "780K"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      # Der Systembereich sind DREI physische 128-B-Seiten (Zyl 0 beidseitig +
      # Zyl 1 Kopf 0); der 1024-B-Datenbereich beginnt asymmetrisch bei Zyl 1
      # Kopf 1, damit das Verzeichnis exakt auf die Zyl-2-Grenze fällt.
      - { cyls: 0,    heads: 0-1, sectors: 26, size: 128  }
      - { cyls: 1,    heads: 0,   sectors: 26, size: 128  }
      - { cyls: 1,    heads: 1,   sectors: 5,  size: 1024 }
      - { cyls: 2-79, heads: 0-1, sectors: 5,  size: 1024 }

  - name:        ds80_5x1024
    aliases:     [cpa800]
    description: "CP/A 800K — 80 Spuren doppelseitig, durchgängig 5×1024"
    title:       "80 Spuren doppelseitig, 5×1024"
    capacity:    "800K"
    drives:      [K5601]
    default_for: [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0-1, sectors: 5, size: 1024 }

  # 640K bzw. 624K passen nur DOPPELSEITIG: 80 × 2 × 16 × 256 B = 640 KB.
  # (Einseitig wären es 320 KB — so stand es bis 2026-08-03 fälschlich im Katalog
  # und davor in den einkompilierten builtinFormats().)  Damit sind beide Formate
  # ausschließlich am zweiköpfigen K5601 fahrbar.
  - name:        ds78_16x256
    aliases:     [cpa624]
    description: "CP/A 624K — 78 Spuren doppelseitig, 16×256 (reduzierte Kapazität)"
    title:       "78 Spuren doppelseitig, 16×256"
    capacity:    "624K"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-77, heads: 0-1, sectors: 16, size: 256 }

  - name:        ss80_5x1024
    aliases:     [cpa200]
    description: "CP/A 400K — 80 Spuren einseitig, 5×1024 (K5600.20)"
    title:       "80 Spuren einseitig, 5×1024"
    capacity:    "400K"
    drives:      [K5601, K5600.20]
    default_for: [K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0, sectors: 5, size: 1024 }

  - name:        ss80_3t26x128-5x1024
    aliases:     [cpa200_boot]
    description: "CP/A 400K bootfähig — 128B-Systemspuren 0-2, danach 5×1024"
    title:       "80 Spuren einseitig, 3 Systemspuren 26×128 + 5×1024"
    capacity:    "400K"
    drives:      [K5601, K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0-2,  heads: 0, sectors: 26, size: 128  }
      - { cyls: 3-79, heads: 0, sectors: 5,  size: 1024 }

  # ══ SCPX-Varianten (5,25″, doppelseitig) ═══════════════════════════════════

  - name:        ds80_6t26x128-5x1024
    aliases:     [scpx780, scpx780_b]
    description: "SCPX 780K — Systemspuren 0-2 mit 26×128, Daten 5×1024"
    title:       "80 Spuren doppelseitig, 3 Systemspuren 26×128 + 5×1024"
    capacity:    "780K"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-2,  heads: 0-1, sectors: 26, size: 128  }
      - { cyls: 3-79, heads: 0-1, sectors: 5,  size: 1024 }

  - name:        ds80_2t16x256-5x1024
    aliases:     [scpx798]
    description: "SCPX 798K — Systemzylinder 0 in 16×256, Daten 5×1024"
    title:       "80 Spuren doppelseitig, 1 Systemspur 16×256 + 5×1024"
    capacity:    "798K"
    drives:      [K5601]
    encoding:    mfm
    # GEMESSEN an tests/fixtures/disks/scpx17_5x1024_k5601_hardy_norm.hfe (GeometryProbe):
    # nur Zylinder 0 ist beidseitig 16×256, ab Zylinder 1 durchgängig 5×1024.  Ohne
    # diesen Eintrag passte die Diskette zu keinem Format des Katalogs.
    tracks:
      - { cyls: 0,    heads: 0-1, sectors: 16, size: 256  }
      - { cyls: 1-79, heads: 0-1, sectors: 5,  size: 1024 }

  # ══ SCP1700 / CP/M-86 (A7100) ══════════════════════════════════════════════
  # Der 16-Bit-Rechner A7100 fährt SCP1700, ein CP/M-86.  Seine 5,25″-Disketten
  # sind durchgängig 16×256 MFM — mit EINER Ausnahme: **Spur 0 Kopf 0 ist FM**
  # mit halber Datenrate (128-B-Sektoren).  Das ist keine Vermutung, das CP/A-BIOS
  # rechnet damit: „Jeder Fehler in Spur 0, Sektor 1 führt zur Annahme von
  # Systemspuren (A7100-System mit 5" FM und 8272-Hardware mit 128er
  # Sektorlänge)" — `biosdsk.mac`, s. tests/fixtures/disks/cpa_cpa780_k5601_clock.prn.
  # Gemessen am Referenzdatenträger (Greaseweazle F1, 300 min⁻¹): FM-Flusszeiten
  # 4/8 µs auf c0h0, MFM 4/6/8 µs überall sonst.
  - name:        ds80_1t16x128fm-16x256
    aliases:     [scp1700_640]
    description: "SCP1700/CP/M-86 640K — Bootspur c0h0 in FM 16×128, sonst 16×256 MFM"
    title:       "80 Spuren doppelseitig, FM-Bootspur 16×128, sonst 16×256"
    capacity:    "640K"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0,    heads: 0,   sectors: 16, size: 128, encoding: fm, rate: 125 }
      - { cyls: 0,    heads: 1,   sectors: 16, size: 256 }
      - { cyls: 1-79, heads: 0-1, sectors: 16, size: 256 }

  # ══ UDOS 1526 / 4.x (ZDOS) ═════════════════════════════════════════════════
  # UDOS formatiert 77 Spuren zu 26×128 MFM.  Beide Seiten tragen je ein eigenes,
  # vollständiges Dateisystem (doc/udos_diskettenformat.md §2) — physisch ist das
  # trotzdem EIN Format.  Beide Einträge sind an den Referenzdisketten gemessen
  # (`disks/udos_boot_*.hfe`, GeometryProbe).

  - name:        ds77_26x128
    aliases:     [udos_ds77]
    description: "UDOS 4.x — 77 Spuren doppelseitig, 26×128 (je Seite ein Dateisystem)"
    title:       "77 Spuren doppelseitig, 26×128"
    capacity:    "500K"
    drives:      [K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0-1, sectors: 26, size: 128 }

  - name:        ss77_26x128
    aliases:     [udos_ss77]
    description: "UDOS 4.x — 77 Spuren einseitig, 26×128"
    title:       "77 Spuren einseitig, 26×128"
    capacity:    "250K"
    drives:      [K5601, K5600.20, MF6400]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 26, size: 128 }

  # MUTOS 8000 (A5120.16): Zylinder 0 traegt einen eigenen 26x128-Bereich (UDOS-Ladespur),
  # das UNIX-Dateisystem beginnt auf Zylinder 1 mit 8x512.  Gemessen an DISK_ROOT/CMD/CC1/CC2.
  - name:        ss77_1t26x128-8x512
    aliases:     [mutos_ss77]
    description: "MUTOS 8000 — Zylinder 0 26×128, Zylinder 1-76 einseitig 8×512"
    title:       "77 Spuren einseitig, 1 Systemspur 26×128 + 8×512"
    capacity:    "307K"
    drives:      [K5601, K5600.20, MF6400]
    encoding:    mfm
    tracks:
      - { cyls: 0,    heads: 0, sectors: 26, size: 128 }
      - { cyls: 1-76, heads: 0, sectors: 8,  size: 512 }

  - name:        ss80_1t26x128-8x512
    aliases:     [mutos_ss80]
    description: "MUTOS 8000 — Zylinder 0 26×128, Zylinder 1-79 einseitig 8×512"
    title:       "80 Spuren einseitig, 1 Systemspur 26×128 + 8×512"
    capacity:    "319K"
    drives:      [K5601, K5600.20]
    encoding:    mfm
    tracks:
      - { cyls: 0,    heads: 0, sectors: 26, size: 128 }
      - { cyls: 1-79, heads: 0, sectors: 8,  size: 512 }

  # ══ 8″-Laufwerke ═══════════════════════════════════════════════════════════

  # Beide 8″-Laufwerke sind einseitig mit 77 Spuren.  Das MF3200 beherrscht NUR FM
  # (~300K), das MF6400 zusätzlich MFM (~600K) — deshalb ist das FM-Format auf beiden
  # fahrbar, das MFM-Format nur auf dem MF6400.  Das K5602 ist zum MF3200 voll
  # kompatibel und hat kein eigenes Profil.

  - name:        fm_ss77_4x1024
    aliases:     [mf3200]
    description: "8″ 308K — 77 Spuren einseitig, 4×1024 FM (Einfachdichte)"
    title:       "8″ 77 Spuren einseitig FM, 4×1024"
    capacity:    "308K"
    drives:      [MF3200, MF6400]
    default_for: [MF3200]
    encoding:    fm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 4, size: 1024 }

  - name:        ss77_8x1024
    aliases:     [mf6400]
    description: "8″ 616K — 77 Spuren einseitig, 8×1024 MFM (Doppeldichte)"
    title:       "8″ 77 Spuren einseitig, 8×1024"
    capacity:    "616K"
    drives:      [MF6400]
    default_for: [MF6400]
    encoding:    mfm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 8, size: 1024 }

  # ═══ EMPIRISCH ERGAENZT (2026-08-10) ═══════════════════════════════════════
  # Erzeugt und vermessen von tests/system/drivers/make_all_formats.py: jedes
  # Format wurde vom Originalprogramm des jeweiligen Systems im Emulator
  # geschrieben (CP/A FORMAT.COM, SCPX INIT.COM) und danach mit
  # `k1520disktool measure` vermessen.  Die Spurbereiche unten sind die MESSUNG,
  # nicht die Menuebeschreibung.
  #
  # ACHTUNG zur `drives:`-Liste: die CP/A-Formate der Fremd-Laufwerkstypen wurden
  # ueber Combo-Bootdisketten erzeugt — dort haelt das GAST-BIOS B:/C: fuer ein
  # K5600.10/.20 bzw. MF3200/MF6400, physisch steckte aber ein K5601 (80 Zyl,
  # 2 Koepfe, FM+MFM).  Die Layouts sind also echt, das Laufwerk war es nicht;
  # `drives:` nennt deshalb jedes Profil, auf das die Geometrie wirklich passt.

  # ── CP/A auf einseitigen 5,25″-Laufwerken ─────────────────────────────────
  - name:        ss40_2t26x128-5x1024
    aliases:     [cpa190]
    description: "CP/A S 190K — 40 Spuren einseitig, 26×128-Systemspuren + 5×1024"
    title:       "40 Spuren einseitig, 2 Systemspuren 26×128 + 5×1024"
    capacity:    "190K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-1,  heads: 0, sectors: 26, size: 128  }
      - { cyls: 2-39, heads: 0, sectors: 5,  size: 1024 }

  - name:        ss80_2t26x128-5x1024
    aliases:     [cpa390]
    description: "CP/A S 390K — 80 Spuren einseitig, 26×128-Systemspuren + 5×1024"
    title:       "80 Spuren einseitig, 2 Systemspuren 26×128 + 5×1024"
    capacity:    "390K"
    drives:      [K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-1,  heads: 0, sectors: 26, size: 128  }
      - { cyls: 2-79, heads: 0, sectors: 5,  size: 1024 }

  - name:        ss80_16x256
    aliases:     [k5601_ss80_16x256]
    description: "80 Spuren einseitig, 16×256 (SCP 308K; auch SCPX INIT 1)"
    title:       "80 Spuren einseitig, 16×256"
    capacity:    "320K"
    drives:      [K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-79, heads: 0, sectors: 16, size: 256 }

  - name:        ss40_9x512
    aliases:     [k5601_ss40_9x512]
    description: "40 Spuren einseitig, 9×512 (DEC VT / VPPC / MSDOS 170-180K)"
    title:       "40 Spuren einseitig, 9×512"
    capacity:    "180K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 9, size: 512 }

  - name:        ss40_8x512
    aliases:     [k5601_ss40_8x512]
    description: "40 Spuren einseitig, 8×512 (CP/M 86 / IBM CPC 156K)"
    title:       "40 Spuren einseitig, 8×512"
    capacity:    "160K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 8, size: 512 }

  # Sektor-IDs, die NICHT bei 1 beginnen — genau dafuer gibt es first_sector.
  - name:        ss40_9x512_id65
    aliases:     [k5601_ss40_9x512_id65]
    description: "40 Spuren einseitig, 9×512 ab Sektor-ID 65 (Schneider S)"
    title:       "40 Spuren einseitig, 9×512, Sektor-IDs ab 65"
    capacity:    "180K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 9, size: 512, first_sector: 65 }

  - name:        ss40_9x512_id193
    aliases:     [k5601_ss40_9x512_id193]
    description: "K5601 §3.4 Format U H (Schneider D) — 40 Sp. einseitig 9×512, IDs C1-C9"
    title:       "40 Spuren einseitig, 9×512, Sektor-IDs C1-C9"
    capacity:    "180K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 9, size: 512, first_sector: 193 }

  - name:        ss40_10x512_id0
    aliases:     [k5601_ss40_10x512_id0]
    description: "40 Spuren einseitig, 10×512 ab Sektor-ID 0 (KAYPRO, 195K)"
    title:       "40 Spuren einseitig, 10×512, Sektor-IDs ab 0"
    capacity:    "195K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0-39, heads: 0, sectors: 10, size: 512, first_sector: 0 }

  # ── SCPX INIT.COM ─────────────────────────────────────────────────────────
