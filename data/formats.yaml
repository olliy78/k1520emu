  # ══ UDOS1715 / NDOS (PC 1715) ══════════════════════════════════════════════
  # Dieselbe Betriebssystemfamilie, ANDERES Dateisystem: der uPD765 des PC 1715
  # erreicht die Bytes hinter der Daten-CRC nicht, deshalb steht die Verkettung in
  # eigenen ZEIGERSEKTOREN statt im Gap.  Folgen (doc/udos1715_diskettenformat.md):
  #   * 256-B-Sektoren, reines Standard-IBM  ->  .img ist moeglich und richtig
  #   * eine "Spur" umfasst BEIDE Seiten eines Zylinders (32 Sektoren)  ->  eine
  #     Diskette ist EIN Datentraeger, kein Side0/Side1
  #   * feste Lage: Verzeichnis Spur 16H, Belegungsplan Spur 17H Sektor 0/1
  # Die drei zugelassenen Formate stehen woertlich im Handbuch §1.2.

  # ── Drei Rechner, ein Dateisystem: PC 1715 · P8000 · A5120 (UDOS 5.0) ─────
  # Die drei folgenden Eintraege sind inhaltlich GLEICH (Geometrie, Lage von Verzeichnis
  # und Plan, Zeigersektoren).  Unterscheiden lassen sich die Disketten nur an EINER
  # Stelle: Spur 17H (23), Sektor 0 = erster Sektor des Belegungsplans, Bytes 158H…176H
  # (344…374) — zwischen den 80 Spureintraegen (18H…157H) und dem „belegt"-Zaehler
  # (177H).  Jeder Formatierer fuellt sie anders (`ndos_fill`):
  #     "00"  PC 1715  (UDOS1715)   158H…176H = 31 × 00
  #     "77"  P8000    (UDOS 2.2)   158H…15BH = 00, 15CH…176H = 27 × 77H (ZDOS-Rest)
  #     "ff"  A5120    (UDOS 5.0)   158H…176H = 31 × FFH (Spuren 80…87 als belegt)
  # Erkannt wird die Diskette ueber dieses Feld, angelegt wird sie damit ebenso
  # (doc/udos1715_diskettenformat.md §3.0a, core/filesystem/udos/udos_bitmap.h).

  - name:        udos1715_ds80_16x256
    aliases:     [udos1715]
    description: "UDOS1715/NDOS (PC 1715) — 80 Spuren doppelseitig, 16×256 (640K, Standard)"
    title:       "UDOS 1715 (NDOS) doppelseitig"
    capacity:    "640K"
    machines:    ["PC 1715"]
    format:      ds80_16x256
    type:        udos1715
    ndos_fill:   "00"     # Spur 17H Sektor 0, 158H…176H = 00
    detect_rank: -10

  - name:        udos_p8000_ds80_16x256
    aliases:     [udos_p8000]
