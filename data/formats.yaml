  # `cpa1715` — CP/A 1715 OHNE Systemspuren: das Verzeichnis beginnt auf c0h0, und der
  # Bootkopf steht IM Verzeichnis (Platz 0 = Kopf, Platz 3 = Laufwerks-Parametersaetze mit
  # Nutzerbyte F0).  EIGENER GRUND fuer den Eintrag: ohne ihn faellt jede solche Diskette
  # an „Verzeichnisplatz 0 ist kein gueltiger Eintrag" durch — und `dir_boot` ist ein
  # Verhalten (Plaetze unangetastet, Kopf als positiver Nachweis), kein Zahlenwert, den die
  # CP/A-Regel ausrechnen koennte.  Erkannt wird NUR mit Bootkopf; eine Datendiskette
  # bleibt `cpa800`.
