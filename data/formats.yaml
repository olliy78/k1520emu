  # ══ SCPX 8915 (K8915) ══════════════════════════════════════════════════════
  # Das BIOS des K8915 (SCPX 8915 V5.3) RECHNET nicht wie CP/A, es hat einen festen
  # DPB (D751H, von DISGEN eingetragen): A: SPT 80, 2 KB, DSM 389, DRM 127, OFF 2 —
  # auch auf einer Diskette OHNE Systemspuren.  Die CP/A-Regel trifft das auf jeder
  # Systemdiskette und auf jeder Diskette, auf die der K8915 schon geschrieben hat,
  # bitgleich (doc/design/16_k8915.md §8a AP-E5a).  EIGENER GRUND fuer den Eintrag:
  # eine frisch formatierte, LEERE Diskette ist Sektor fuer Sektor dieselbe wie eine
  # leere CP/A-Datendiskette (`cpa800`, 192 Plaetze ab Zylinder 0) — wer sie fuer den
  # K8915 fuellen will, braucht einen Namen (`--fs scpx8915`, `create --fs scpx8915`).
  # `detect: false`: in der Erkennung machte er nur jede leere cpa800 mehrdeutig.
  # B: in 16×256 (DISGEN-Einstellung der Diskette 901) braucht nichts: `dtrsl1`
  # traegt dort ein FESTES Offset, die Regel liefert immer OFF 2 / 128 (DSM 311).

  - name:        scpx8915_ds80_5x1024_boot
    aliases:     [scpx8915]
    description: "SCPX 8915 (K8915) 780K — Systemzylinder 0-1, Dateisystem ab Zylinder 2"
    title:       "SCPX 8915 Systemdiskette"
    capacity:    "780K"
    machines:    [K8915]
    format:      ds80_5x1024
    type:        cpm
    data_start:  { cyl: 2, head: 0 }
    block_size:  2048
    dir_entries: 128
    detect:      false
    # Bootabbilder muessen einen K8915-Ladekopf tragen (Sektor 1: 16 Byte, CRC 0) —
    # ein A5120-CP/A-Abbild wird abgewiesen statt still geschrieben (AP-E5c).
    boot_header: k8915

