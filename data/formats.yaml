  # bereich, den SCPX zum Booten braucht.
  - name:        ss80_1t16x256-5x1024
    aliases:     [scpx_ss80_5x1024]
    description: "SCPX INIT 4 — 80 Spuren einseitig, Zylinder 0 in 16×256, dann 5×1024"
    title:       "80 Spuren einseitig, 1 Systemspur 16×256 + 5×1024"
    capacity:    "399K"
    drives:      [K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0,    heads: 0, sectors: 16, size: 256  }
      - { cyls: 1-79, heads: 0, sectors: 5,  size: 1024 }

  - name:        ss40_1t16x256-5x1024
    aliases:     [scpx_ss40_5x1024]
    description: "SCPX INIT 4 auf 40 Spuren — Zylinder 0 in 16×256, dann 5×1024"
    title:       "40 Spuren einseitig, 1 Systemspur 16×256 + 5×1024"
    capacity:    "199K"
    drives:      [K5600.10, K5600.20, K5601]
    encoding:    mfm
    tracks:
      - { cyls: 0,    heads: 0, sectors: 16, size: 256  }
      - { cyls: 1-39, heads: 0, sectors: 5,  size: 1024 }

  # ── 8″-Layouts (CP/A-Menue der 8″-Laufwerkstypen) ─────────────────────────
  # Durchgaengig FM beim MF3200-Menue; das MF6400-Menue mischt FM-Systemspuren
  # mit MFM-Datenspuren — genau der Fall, fuer den TrackFormat ein eigenes
  # `encoding` je Spurbereich hat.
  - name:        fm_ss77_26x128
    aliases:     [mf3200_26x128]
    description: "8″-Layout — 77 Spuren einseitig, 26×128 FM (243/250K)"
    title:       "8″ 77 Spuren einseitig FM, 26×128"
    capacity:    "250K"
    drives:      [MF3200, MF6400, K5601]
    encoding:    fm
    tracks:
      - { cyls: 0-76, heads: 0, sectors: 26, size: 128 }

  - name:        fm_ss77_3t26x128-4x1024
    aliases:     [mf3200_296k]
    description: "8″-Layout CP/A BC — 26×128-Systemspuren 0-2, dann 4×1024, FM"
    title:       "8″ 77 Spuren einseitig FM, 3 Systemspuren 26×128 + 4×1024"
    capacity:    "296K"
    drives:      [MF3200, MF6400, K5601]
    encoding:    fm
    tracks:
      - { cyls: 0-2,  heads: 0, sectors: 26, size: 128  }
      - { cyls: 3-76, heads: 0, sectors: 4,  size: 1024 }

  - name:        fm_ss77_1t26x128-4x1024
    aliases:     [mf3200_scp296k]
    description: "8″-Layout SCP — Systemspur 0 in 26×128, dann 4×1024, FM"
    title:       "8″ 77 Spuren einseitig FM, 1 Systemspur 26×128 + 4×1024"
    capacity:    "296K"
    drives:      [MF3200, MF6400, K5601]
    encoding:    fm
    tracks:
      - { cyls: 0,    heads: 0, sectors: 26, size: 128  }
      - { cyls: 1-76, heads: 0, sectors: 4,  size: 1024 }

  - name:        fm_ss77_9x512
    aliases:     [mf3200_9x512]
    description: "8″-Layout — 77 Spuren einseitig, 9×512 FM (346K)"
    title:       "8″ 77 Spuren einseitig FM, 9×512"
    capacity:    "346K"
    drives:      [MF3200, MF6400, K5601]
