# Bauangaben der UDOS-Ladedisketten fuer MUTOS 8000 (Entwurf 39 §9.13; bau_ladediskette.py).
# Vorlage fuer tools/mutos8000/archiv_erzeugen.py --art ladediskette; der Bau liest sie aus dem Archiv.
# Nur "schluessel: wert", ein Wert je Zeile.
art: ladediskette
# Profile je Aufzeichnungsverfahren: FM (8 Zoll, MF3200) und MFM (5,25 Zoll, K5601)
fs_fm: udos_ss77_fm
fs_mfm: udos_ss77
# Systemspuren (Spur 0-2 mit dem SYL-Ladekopf plus Bootspur), Rohbytes aus `boot-get`
systemspuren: systemspuren.bin
# Laufwerkstyp-Konstante: `LD A,2AH / AND D / LD (0FCAH),A` (Zylinder 2, Sektor-ID 1, Offset 120/121).
# 2 Bit je Laufwerk (A: unten): 1 = 40 Spuren MFM, 2 = 77 Spuren FM, 3 = 77 Spuren MFM.
# Das Muster muss GENAU EINMAL in den Systemspuren stehen, das zweite Byte ist der Erwartungswert
# der Vorlage (sonst bricht der Bau ab, bevor etwas gepatcht wird).  `??` = beliebig (die Konstante).
typ_muster: 3E??A232CA0F
typ_erwartet: 2A
# Varianten: <Aufzeichnung> <Konstante>
variante_mf3200: fm 2A
variante_k5601: mfm FF
variante_mf3200_k5601: fm FE
# Varianten mit Patches (Entwurf 39, 11.2/11.5/11.6; Patchfunktionen in mutos_patch.py, angewandt BEIM BAU auf eine Kopie von dateien/).
# Zeile: patch_<variante>_<n>: <Datei> <Art> [opt=zahl ...], n = Reihenfolge.  Arten: io-8x512 | zdos-einheit0 | kern.
# nur_a: UDOS meldet beim Start nur A: an, MUTOS-Disketten duerfen schon in B:-D: liegen
variante_k5601_nur_a: mfm FF
patch_k5601_nur_a_1: ZDOS zdos-einheit0
variante_mf3200_k5601_nur_a: fm FE
patch_mf3200_k5601_nur_a_1: ZDOS zdos-einheit0
# 8x512: DISK-Satz (root/cc1/cc2/cmd.td0, MFM 250 kbit/s, nur K5601).  Swap ab Block 352 = s_fsize von DISK-ROOT,
# 352 + 256 = 608 = Blockgrenze 8 x 512; der Bau bricht ab, wenn s_fsize > swplo.
variante_k5601_8x512: mfm FF
patch_k5601_8x512_1: mutos_io io-8x512
patch_k5601_8x512_2: ZDOS zdos-einheit0
patch_k5601_8x512_3: mutos_1216 kern swplo=352 nswap=256
wurzel_fsize_k5601_8x512: 352
